<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체중 기록 대시보드</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        #graph {
            width: 100%;
            min-height: 400px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 16px;
            padding: 40px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 20px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ 체중 기록 대시보드</h1>
            <p>매일의 체중 변화를 추적하세요</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">현재 체중</div>
                <div class="stat-value" id="current">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">평균</div>
                <div class="stat-value" id="average">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최고</div>
                <div class="stat-value" id="highest">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최저</div>
                <div class="stat-value" id="lowest">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">변화</div>
                <div class="stat-value" id="change">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">기록 수</div>
                <div class="stat-value" id="count">-</div>
            </div>
        </div>

        <div class="chart-container">
            <div id="graph" class="loading">데이터를 로드하는 중...</div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                if (!data.dates || data.dates.length === 0) {
                    document.getElementById('graph').innerHTML =
                        '<div style="text-align: center; padding: 40px; color: #999;">아직 기록된 데이터가 없습니다.</div>';
                    return;
                }

                const weights = data.weights;

                // 통계 업데이트
                document.getElementById('current').textContent = weights[weights.length - 1].toFixed(1) + 'kg';
                document.getElementById('average').textContent = (weights.reduce((a, b) => a + b) / weights.length).toFixed(1) + 'kg';
                document.getElementById('highest').textContent = Math.max(...weights).toFixed(1) + 'kg';
                document.getElementById('lowest').textContent = Math.min(...weights).toFixed(1) + 'kg';
                document.getElementById('change').textContent = (weights[weights.length - 1] - weights[0]).toFixed(1) + 'kg';
                document.getElementById('count').textContent = weights.length + '일';

                // 그래프 그리기
                const trace = {
                    x: data.dates,
                    y: weights,
                    mode: 'lines+markers',
                    name: '체중',
                    line: { color: '#667eea', width: 3 },
                    marker: { size: 8 }
                };

                const layout = {
                    title: '체중 변화',
                    xaxis: { title: '날짜' },
                    yaxis: { title: '체중 (kg)' },
                    hovermode: 'x unified',
                    plot_bgcolor: '#f8f9fa',
                    paper_bgcolor: 'white',
                    font: { family: 'Arial, sans-serif' }
                };

                Plotly.newPlot('graph', [trace], layout, { responsive: true });

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('graph').innerHTML =
                    '<div class="error">데이터를 불러올 수 없습니다.</div>';
            }
        }

        // 페이지 로드 시 데이터 불러오기
        loadData();

        // 30초마다 자동 새로고침
        setInterval(loadData, 30000);
    </script>
</body>
</html>
